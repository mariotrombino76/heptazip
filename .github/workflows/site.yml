# Sito di presentazione (site/): build a ogni pull request che lo tocca,
# pubblicazione su GitHub Pages a ogni push su develop.
name: Site

on:
  push:
    branches: [develop]
    paths: ['site/**', 'docs/logo/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'docs/logo/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Sito (build)
    runs-on: ubuntu-latest
    outputs:
      indexnow_key: ${{ steps.indexnow.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Dipendenze (Tailwind CLI)
        working-directory: site
        run: npm ci
      - name: Genera il sito
        run: python3 site/build.py
      - name: Controlla le pagine generate
        run: |
          test -s site/dist/index.html
          test -s site/dist/en/index.html
          test -s site/dist/style.css
          test -s site/dist/llms.txt
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('site/dist/sitemap.xml')"
      - name: Chiave IndexNow (il file <chiave>.txt pubblicato dal sito)
        id: indexnow
        run: |
          key=$(ls site/static | sed -n 's/^\([0-9a-f]\{32\}\)\.txt$/\1/p')
          test -n "$key" && test "$(cat site/dist/$key.txt)" = "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Sito (pubblicazione)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Avvisa i motori che usano IndexNow (Bing, Yandex, Seznam, Naver) che le pagine sono
      # cambiate. Google non lo usa: vedi site/README.md. Un errore qui non ferma nulla.
      - name: Segnala le pagine a IndexNow
        continue-on-error: true
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          KEY: ${{ needs.build.outputs.indexnow_key }}
        run: |
          site="${SITE%/}"
          host="${site#https://}"; host="${host%%/*}"
          # il file della chiave deve essere gia' leggibile, o la segnalazione viene rifiutata
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null "$site/$KEY.txt" && break
            sleep 10
          done
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$host\",\"key\":\"$KEY\",\"keyLocation\":\"$site/$KEY.txt\",\"urlList\":[\"$site/\",\"$site/en/\"]}"
